# Was "gewjbombgrhqlebkwcjq", which is not the project this site runs against.
# The live project is "Myve Media" — same ref as VITE_SUPABASE_URL in .env.local.
project_id = "nkfefurnjhupzealopym"

# The code gate is called by visitors who have no session yet, so this one
# function must be reachable without a JWT. It does its own rate limiting.
[functions.redeem-code]
verify_jwt = false

# The MCP server is called by a desktop AI assistant, which has no Supabase
# session to present. It authenticates with its own shared bearer token
# (PORTAL_MCP_TOKEN) instead, so Supabase's JWT gate has to be off or the
# request is rejected before the function ever runs.
[functions.portal-mcp]
verify_jwt = false
