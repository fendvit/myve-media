# Codemagic builds the iOS app on a rented Mac, because Xcode cannot run on
# Windows and this repo is developed on Windows. Nothing here needs a local Mac:
# the signing certificate and provisioning profile are generated on Codemagic's
# machine from an App Store Connect API key, so there is no Keychain step a
# human has to perform.
#
# Android is deliberately NOT here — it still builds locally via
# `npm run build:aab`, which uses the upload keystore in C:\AI-OS\firma\keys\.
# Moving that keystore into a cloud CI would mean uploading a signing key, and
# the key is the one thing that cannot be re-issued if it leaks.

workflows:
  ios-portal:
    name: MYVE Portal - iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Created once in the Codemagic UI (Teams > Integrations > App Store
      # Connect) by uploading the .p8 API key generated at
      # appstoreconnect.apple.com > Users and Access > Integrations.
      # The name below must match the name given there, character for character.
      app_store_connect: MYVE App Store Connect

    environment:
      # Declaring the signing here is what makes Codemagic fetch (and create on
      # first use) the distribution certificate and provisioning profile, and
      # install them into the build keychain before any script runs.
      #
      # Doing it by hand with `keychain initialize` + `app-store-connect
      # fetch-signing-files --create` does NOT work: that path needs a
      # certificate private key to persist the certificate it creates, and
      # without one it fails with "Cannot save Signing Certificates without
      # certificate private key", leaves `Provisioning Profiles: []`, and
      # xcodebuild then dies with "App requires a provisioning profile".
      ios_signing:
        distribution_type: app_store
        bundle_identifier: media.myve.portal
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: media.myve.portal
      groups:
        # Codemagic UI > Environment variables, group name `portal_build`.
        # Holds VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and
        # VITE_VAPID_PUBLIC_KEY. All three are publishable values that end up in
        # the browser bundle anyway, but they live in a group rather than in this
        # file so that rotating a Supabase project doesn't require a commit.
        - portal_build
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      # Manual only. An automatic build on every push to main would burn the
      # 500 free macOS minutes on commits that only touch the marketing site.
      events: []

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build the portal web bundle
        # NOT `npm run build` — that emits the marketing site as the entry, and
        # the native shell would open myve.media instead of the portal. See the
        # webDir comment in capacitor.config.ts.
        script: npm run build:native

      - name: Sync web bundle and plugins into the iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        # Skipped when `cap add ios` runs on Windows, so this is the first time
        # the Pods are actually resolved. It is also why the build reads
        # App.xcworkspace rather than App.xcodeproj.
        script: |
          cd ios/App
          pod install

      - name: Set the build number
        # App Store Connect rejects an upload whose build number it has already
        # seen, even for a version that was never released. $BUILD_NUMBER is
        # Codemagic's per-workflow counter, so it always moves forward.
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Apply the signing profile to the Xcode project
        # The certificate and profile are already on the machine, put there by
        # the `ios_signing` block above. This only writes them into the project's
        # build settings, which Capacitor's generated project does not carry.
        script: xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      # Retained because a failed xcodebuild says almost nothing in the Codemagic
      # log itself; the real error is always in this file.
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight but does NOT submit for App Store review —
        # review submission stays a deliberate human action in App Store Connect.
        submit_to_testflight: true
